services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: documind-redis
    restart: unless-stopped
    ports: 
      - "6379:6379"
    volumes:
      - redis_storage:/data


volumes:
  qdrant_storage:
  redis_storage: